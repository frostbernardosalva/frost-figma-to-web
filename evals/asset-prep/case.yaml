schema_version: "1.0"
name: Asset prep reaches for the converter, and does not skip it silently
description: >
  A folder of PNG exports. Stage 0.5 says convert to AVIF before building, and
  the plugin ships bin/to-avif.py to do it. Does a fresh reader actually run it
  - and if no encoder is available, do they say so rather than quietly shipping
  the PNGs? The prompt deliberately never says "AVIF": if the rule only fires
  when the user names it, the rule is not doing any work.
tags: ["asset-prep"]
runs: 3
execution:
  prompt: |
    I have a folder of image exports at ./exports that I need to get ready for
    a Webflow build. They came out of Figma at four breakpoints.

    Get them ready to upload, and tell me when they are.
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 12
  timeout_seconds: 300
  scaffold_script: python "${CLAUDE_PLUGIN_ROOT}/evals/scaffold.py" .
